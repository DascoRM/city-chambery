# nginx pour le diorama (site statique).
# TLS et nom de domaine : gérés par le proxy de Coolify, pas ici.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Compression (city.json : 1,4 Mo → ~400 Ko)
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/css application/javascript application/json model/gltf-binary image/svg+xml;

    # Fichiers de Vite avec empreinte dans le nom (index-XXXX.js…) : ne changent jamais → cache 1 an
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Données et modèles : nom fixe → le navigateur garde une copie mais revérifie à chaque visite
    # (ETag : réponse 304 sans contenu si rien n'a changé). Évite de servir une ancienne carte.
    location ~* \.json$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
    location ~* \.glb$ {
        types { model/gltf-binary glb; } # type inconnu de nginx par défaut
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Page d'accueil : toujours revérifiée (elle pointe vers les fichiers /assets/ du dernier build)
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
