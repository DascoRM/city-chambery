# nginx pour le diorama : la carte seule (site statique ; l'API et l'administration tournent sur Vercel).
# TLS et nom de domaine : gérés par le proxy de Coolify, pas ici.

# Données et modèles : adresse versionnée (?v=empreinte, ajoutée par le code) → cache 1 an ;
# sans ?v= (ancien lien, accès direct) → revérifiés à chaque visite.
map $arg_v $data_cache_control {
    ""      "no-cache";
    default "public, max-age=31536000, immutable";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Compression (city.json : 1,4 Mo → ~400 Ko)
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/css application/javascript application/json application/manifest+json model/gltf-binary image/svg+xml;

    # Fichiers de Vite avec empreinte dans le nom (index-XXXX.js…) : ne changent jamais → cache 1 an
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Données et modèles : cache selon ?v= (voir la map ci-dessus). Quand les données changent,
    # l'empreinte change, donc l'adresse aussi : jamais d'ancienne carte.
    location ~* \.json$ {
        add_header Cache-Control $data_cache_control;
        try_files $uri =404;
    }
    location ~* \.glb$ {
        types { model/gltf-binary glb; } # type inconnu de nginx par défaut
        add_header Cache-Control $data_cache_control;
        try_files $uri =404;
    }

    # Mode hors-ligne : manifeste de l'appli et service worker toujours revérifiés
    # (sinon une mise à jour du site pourrait mettre des jours à arriver sur les téléphones)
    location = /manifest.webmanifest {
        types { application/manifest+json webmanifest; }
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Pas d'API ni d'administration sur le Pi (EP010, décisions D4 et D11) : un 404 net plutôt que la page de la carte.
    # « ^~ » : ces préfixes passent avant les règles sur les .json et .glb ci-dessus. La carte voit le 404 et repart avec
    # ses retouches locales (content/parkings.json) ; le service worker n'envoie pas /api ni /admin vers la page.
    location ^~ /api/ {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 404 '{"error":"introuvable","code":"introuvable"}';
    }
    location = /admin { return 404; }
    location ^~ /admin/ { return 404; }

    # Page d'accueil : toujours revérifiée (elle pointe vers les fichiers /assets/ du dernier build)
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
