# Déploiement du diorama, pensé pour Coolify (type de ressource « Docker Compose »).
#
# Coolify construit l'image depuis le Dockerfile, puis branche son proxy (Traefik) sur le port 80
# du conteneur : le domaine et le HTTPS se règlent dans l'interface de Coolify, service « web ».
# Port publié 3000 : accès direct http://<ip-du-pi>:3000 en plus du domaine géré par Coolify.
# Essai en local : `npm run docker:up` (= docker compose up --build -d) → http://localhost:3000
services:
  web:
    build:
      context: .
      args:
        # true : le build régénère toutes les données (npm run data : OpenStreetMap + IGN, puis
        # npm run nature). Si un service est indisponible, les données du dépôt sont gardées.
        # false : build rapide avec les données du dépôt (aucun téléchargement).
        REFRESH_DATA: "true"
    container_name: city-chambery
    restart: unless-stopped
    ports:
      - '3000:80' # port 3000 du Pi → port 80 du conteneur (nginx écoute sur 80)
